[pytest]
asyncio_mode = auto
testpaths = tests
addopts =
    --cov=app
    --cov-report=term-missing
    --cov-report=xml:coverage.xml
    --cov-report=html:htmlcov
    -v
    --tb=short
filterwarnings =
    ignore::DeprecationWarning:passlib
    ignore::DeprecationWarning:jose
    ignore::pytest.PytestUnraisableExceptionWarning
